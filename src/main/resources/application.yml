server:
  port: ${LICENCES_PORT:8099}

  # Derrière un relais qui termine le TLS, l'application ne voit que du HTTP en clair : elle
  # fabriquerait alors une adresse de retour en « http:// » là où le navigateur et le royaume
  # attendent « https:// ». Keycloak compare cette adresse caractère par caractère à celle
  # déclarée dans le client, et refuse la connexion sur « Invalid parameter: redirect_uri ».
  #
  # Les en-têtes « X-Forwarded-* » posés par le relais sont donc lus, et c'est le schéma réel qui
  # sert à bâtir l'adresse de retour.
  #
  # LE RELAIS DOIT LES POSER — sans quoi ce réglage n'a rien à lire :
  #   proxy_set_header Host              $host;
  #   proxy_set_header X-Forwarded-Proto $scheme;
  #
  # « framework » plutôt que « native » : le filtre de Spring vaut pour tout serveur embarqué, là
  # où « native » délègue à la vanne de Tomcat, qu'il faut en outre restreindre aux adresses du
  # relais. En développement, sans relais, ces en-têtes n'arrivent pas et rien ne change.
  forward-headers-strategy: framework

  servlet:
    session:
      # La session vit dans un cookie que le script de la page ne peut pas lire : un script tiers
      # injecté ne pourrait pas l'exfiltrer. « Lax » l'empêche d'accompagner une requête déclenchée
      # depuis un autre site. « secure » exige HTTPS — à activer dès que le back-office y est publié.
      cookie:
        name: LICENCES_SESSION
        http-only: true
        same-site: lax
        secure: ${LICENCES_COOKIE_SECURE:false}
      timeout: ${LICENCES_SESSION_DUREE:8h}

spring:
  application:
    name: qualisira-licences

  # PostgreSQL, comme les autres services QualiSira : même serveur, même sauvegarde, mêmes
  # habitudes d'exploitation. Ce que contient cette base — partenaires, conditions commerciales,
  # licences émises — mérite les mêmes égards que la production.
  datasource:
    url: ${LICENCES_DB_URL:jdbc:postgresql://localhost:5432/qualisira_licencesdb}
    username: ${LICENCES_DB_USER:postgres}
    password: ${LICENCES_DB_MDP:root}

  # Le schéma est décrit par des migrations versionnées, dans db/migration.
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Une base déjà en service n'est pas vide : Flyway la marque « v1 » au lieu de rejouer le
    # schéma initial, qui échouerait sur des tables existantes. Une base vide, elle, reçoit V1
    # puis la suite. Les deux convergent ensuite.
    baseline-on-migrate: true
    baseline-version: 1
    # Sans apostrophe : Flyway interpole cette description dans le SQL qui inscrit la ligne de
    # référence, et une apostrophe y casse la migration au premier démarrage.
    baseline-description: Schema initial releve avant la mise en place de Flyway
    # Un script déjà appliqué puis modifié fait échouer le démarrage, plutôt que d'appliquer un
    # schéma qui ne correspond plus à l'historique.
    validate-on-migrate: true

  jpa:
    hibernate:
      # Le schéma vient des migrations, plus des entités. « update » le corrigeait en silence à
      # chaque démarrage : une colonne renommée en laissait deux, un type élargi ne revenait
      # jamais en arrière, et rien ne disait qui avait changé quoi. « validate » signale au
      # démarrage tout écart entre les entités et le schéma migré.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Remise des licences par courriel. Mêmes réglages que les services QualiSira : le serveur
  # d'envoi est le même, seul l'objet du message change.
  mail:
    host: ${MAIL_HOST:mail.qualisira.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:noreply@qualisira.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  security:
    oauth2:
      client:
        registration:
          keycloak:
            # Variables préfixées « KC_LICENCES_ », et non les « KC_ » habituelles : les autres
            # services QualiSira partagent KC_ISSUER_URI, KC_CLIENT_ID et KC_CLIENT_SECRET pour le
            # royaume « quali » et le client « quali-sira ». Cet outil ayant son propre royaume,
            # reprendre ces noms le ferait démarrer avec le secret d'un autre client — et échouer
            # à l'échange du code, longtemps après le démarrage, sur un « invalid_client » que
            # rien ne relie à la cause.
            client-id: ${KC_LICENCES_CLIENT:qualisira-licences}
            # Sans valeur par défaut, et ce fichier est versionné : un secret écrit ici serait un
            # secret publié, quel que soit le dépôt. Ce secret vaut la clé de signature des
            # licences, puisqu'il ouvre l'outil qui la détient.
            #
            # À poser dans l'environnement : KC_LICENCES_SECRET. En mode « local » il ne sert pas,
            # et son absence est sans conséquence ; en mode « keycloak » elle fait échouer
            # l'échange du code, avec un « invalid_client » explicite.
            client-secret: ${KC_LICENCES_SECRET:}
            authorization-grant-type: authorization_code
            scope: openid, profile, email
            # Le back-office est servi par cette application : Keycloak renvoie ici après
            # connexion, et la session prend le relais.
            #
            # « baseUrl » est déduit de l'en-tête « Host » reçu. Tout relais placé devant doit
            # donc CONSERVER cet en-tête : le remplacer par celui de la cible ferait réclamer une
            # adresse interne, que le royaume refuserait. En développement, proxy.conf.json pose
            # « changeOrigin: false » pour cette raison ; en production, nginx doit poser
            # « proxy_set_header Host $host ». L'oubli ne se voit pas en mode local — seulement le
            # jour du passage à Keycloak.
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            # Royaume dédié : les comptes qui émettent des licences ne se mêlent pas à ceux des
            # autres services QualiSira.
            issuer-uri: ${KC_LICENCES_ISSUER:http://localhost:8080/realms/qualisira-licences}
            # Le nom lisible plutôt que « sub » : c'est lui qui est inscrit dans « émise par »
            # sur chaque licence.
            user-name-attribute: preferred_username

licences:
  auth:
    # « keycloak » en fonctionnement normal ; « local » pour la mise au point ou un poste hors
    # réseau — l'émission d'une licence ne doit pas dépendre de la disponibilité de Keycloak.
    mode: ${LICENCES_AUTH:local}
    # Rôle Keycloak exigé pour entrer. Cet outil signe les licences : y accéder, c'est pouvoir
    # s'en émettre une. À créer dans le royaume et à n'attribuer qu'à l'équipe éditeur.
    #
    # Ce rôle n'ouvre que la porte : il n'accorde aucune permission. Ce qu'ouvre chaque rôle est
    # décrit ici, dans la table « roles » — un rôle du royaume portant le même code que l'un d'eux
    # en reçoit les permissions. Un compte du royaume porte donc DEUX rôles : celui-ci, et son
    # rôle métier (SUPER_ADMIN, EDITEUR, LECTEUR). Avec le seul rôle d'entrée, l'application
    # s'ouvre mais chaque action y est refusée.
    role-requis: ${LICENCES_ROLE:LICENCES_EDITEUR}

  # Le super administrateur créé au premier démarrage : c'est lui qui ouvre les comptes des
  # autres et leur attribue des rôles. Il porte le rôle SUPER_ADMIN, qui reçoit d'office toutes
  # les permissions du catalogue. Rien n'est recréé aux démarrages suivants dès qu'un compte
  # actif porte ce rôle — renommer ou remplacer ce compte est donc sans danger.
  admin:
    utilisateur: ${LICENCES_ADMIN_UTILISATEUR:admin}
    # Vide, et ce fichier est versionné : un mot de passe écrit ici vaudrait pour toute
    # installation clonant ce dépôt, et le premier compte de l'outil qui signe les licences
    # serait connu de tous. Un mot de passe est donc tiré au hasard au premier démarrage et
    # annoncé une seule fois dans le journal — à noter à ce moment-là.
    #
    # LICENCES_ADMIN_MDP permet d'en choisir un. Dans les deux cas, l'écran en réclame le
    # changement à la première connexion.
    mot-de-passe: ${LICENCES_ADMIN_MDP:}
    nom: ${LICENCES_ADMIN_NOM:Super administrateur}
    # Destinataire des accès du premier compte. Le mot de passe lui est envoyé plutôt qu'affiché
    # dans le journal : sur une installation livrée, ce journal part dans un collecteur que
    # personne ne lit à l'instant précis du premier démarrage, et le mot de passe s'y perd. Il
    # reste annoncé dans le journal si l'envoi échoue.
    #
    # VIDE, ET SANS DÉFAUT : cette adresse reçoit le mot de passe du compte qui a la main sur la
    # clé de signature. Une adresse écrite ici vaudrait pour toute installation clonant ce dépôt,
    # et l'envoi partirait sans que personne ne l'ait choisi. Rien n'est donc ouvert dans le
    # royaume tant qu'elle n'est pas posée — c'est un démarrage incomplet et bruyant, préférable
    # à un mot de passe expédié à la mauvaise personne.
    email: ${LICENCES_ADMIN_EMAIL:}

    # Mode Keycloak seulement : ouvrir le premier compte DANS le royaume au démarrage, avec le
    # rôle d'entrée et SUPER_ADMIN, puis lui envoyer ses accès.
    #
    # Rien n'est fait si un compte porte déjà le rôle d'entrée : un royaume en service ne se voit
    # pas ajouter de compte que personne n'a demandé.
    #
    # À PESER : cela demande que le client porte un compte de service avec « manage-users » et
    # « manage-realm ». Un client autorisé à créer des comptes dans le royaume peut s'en créer
    # un — sur un royaume partagé, cette portée dépasse cet outil. « false » pour créer le
    # premier compte à la main depuis la console.
    provisionner: ${LICENCES_ADMIN_PROVISION:true}
    keycloak:
      # Vides, le client de connexion sert lui-même : c'est à lui qu'on active le compte de
      # service. Un client distinct permet de ne pas mêler la connexion des utilisateurs et
      # l'administration du royaume — deux droits qui n'ont pas la même portée.
      client: ${KC_LICENCES_ADMIN_CLIENT:}
      secret: ${KC_LICENCES_ADMIN_SECRET:}

  # Adresse publique du back-office, pour que les courriels portent un lien cliquable. Au
  # démarrage, aucune requête n'est encore arrivée : il n'y a rien d'où la déduire. Vide, le
  # message reste juste, il n'y manque que le lien.
  url: ${LICENCES_URL:}

  # Le back-office est servi par cette application : une seule origine, donc pas de CORS, pas de
  # relais à configurer, et une adresse de retour vers Keycloak qu'aucun intermédiaire n'a pu
  # réécrire. Vide, les fichiers sont cherchés dans le jar (classpath:/static/).
  front:
    dossier: ${LICENCES_FRONT:}

  cles:
    # Engendré au premier démarrage. À SAUVEGARDER et à ne jamais versionner : c'est la clé qui
    # signe toutes les licences.
    fichier: ${LICENCES_CLES:./data/cles-editeur.properties}


  envoi:
    # Expéditeur affiché, s'il diffère du compte SMTP. C'est l'en-tête « From » : une ADRESSE, et
    # non un libellé. « L'équipe QualiSira » seul est rejeté avant même que le serveur SMTP soit
    # contacté, et plus aucun courriel ne part — ni les licences, ni les accès du premier compte.
    # Seules « Nom <adresse> » et l'adresse nue conviennent.
    expediteur: ${LICENCES_EXPEDITEUR:noreply@qualisira.com}

  cors:
    # Origines du back-office Angular. Énumérées, jamais « * » : la session accompagne chaque
    # appel. En développement, le proxy d'Angular rend cette liste inutile.
    origines: ${LICENCES_CORS:http://localhost:4300}

logging:
  level:
    com.qualiapproche.licences: INFO
